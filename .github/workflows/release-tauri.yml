name: Release JPOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "jpos-v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows updater
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_SHOP_ID: "20692"
      NEXT_PUBLIC_JPULSE_API_URL: https://api-erp.joyworldcityfuns.vn
      NEXT_PUBLIC_INVOICE_REQUEST_BASE_URL: https://jpulse.joyworldcityfuns.vn/invoice-request

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish JPOS
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: jpos-v__VERSION__
          releaseName: JPOS v__VERSION__
          releaseBody: |
            Bản cập nhật JPOS v__VERSION__.

            - Thêm màn hình đổi voucher do J-PULSE phát hành bằng máy quét barcode hoặc QR.
            - Tự động ánh xạ voucher vé/quà sang sản phẩm và kiểm tra phạm vi cửa hàng trước khi sử dụng.
            - Hỗ trợ voucher giảm phần trăm trên toàn đơn, tối đa một mã giảm phần trăm cho mỗi đơn.
            - Bỏ qua lần đọc trùng của máy quét để nhân viên không nhận hai kết quả trái ngược cho cùng một mã.
            - Gom các voucher vé/quà thành một bill; tự chốt sau 10 giây hoặc chốt ngay bằng nút Xác nhận & in.
            - Giữ nguyên việc in từng vé tương ứng với sản phẩm và hỗ trợ in lại khi máy in gặp lỗi.
            - Cải thiện khả năng khôi phục đơn thanh toán có voucher khi ứng dụng bị gián đoạn.

            Ứng dụng JPOS sẽ tự kiểm tra, xác thực chữ ký và cài đặt bản phát hành này.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
