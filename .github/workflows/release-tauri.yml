name: Release JPOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "jpos-v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows updater
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_SHOP_ID: "20692"
      NEXT_PUBLIC_JPULSE_API_URL: https://api-erp.joyworldcityfuns.vn
      NEXT_PUBLIC_INVOICE_REQUEST_BASE_URL: https://jpulse.joyworldcityfuns.vn/invoice-request

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish JPOS
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: jpos-v__VERSION__
          releaseName: JPOS v__VERSION__
          releaseBody: |
            Bản cập nhật JPOS v__VERSION__.

            - Đồng bộ thuế suất trực tiếp từ dữ liệu của từng sản phẩm và lưu vào dữ liệu POS.
            - Chốt giá trước thuế, thuế suất và tiền thuế chính xác khi tạo đơn hàng mới.
            - Bill hiển thị đơn giá, thành tiền từng dòng và tạm tính theo giá trước thuế.
            - Tách riêng tiền thuế theo từng mặt hàng và tổng tiền thuế của toàn đơn.
            - Tự hiệu chỉnh khi in các đơn cũ có thuế suất nhưng tiền thuế bị lưu bằng 0.
            - Không in dòng thuế khi thuế suất hoặc tiền thuế thực tế bằng 0.

            Ứng dụng JPOS sẽ tự kiểm tra, xác thực chữ ký và cài đặt bản phát hành này.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
